# Render blueprint: FastAPI backend + managed PostgreSQL.
# New > Blueprint in the Render dashboard, point it at this repo, then fill in the
# variables marked sync: false. Deploy the frontend separately on Vercel (see README).
services:
  - type: web
    name: campus-inbox-agent-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    # Migrations run on startup (MIGRATE_ON_STARTUP defaults to true).
    startCommand: uvicorn app.main:create_app --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: campus-inbox-db
          property: connectionString
      - key: APP_TOKEN
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: CORS_ORIGINS
        sync: false # e.g. https://your-app.vercel.app
      - key: IMAP_HOST
        sync: false
      - key: IMAP_USER
        sync: false
      - key: IMAP_PASSWORD
        sync: false
      - key: IMAP_SENDER_FILTER
        sync: false

databases:
  - name: campus-inbox-db
    plan: free
    databaseName: campus_inbox
