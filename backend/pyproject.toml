[project]
name = "campus-inbox-agent"
version = "0.1.0"
requires-python = ">=3.11"
# Keep in sync with requirements.txt (Vercel installs from this list).
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "google-genai>=1.0",
    "msal>=1.31",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
