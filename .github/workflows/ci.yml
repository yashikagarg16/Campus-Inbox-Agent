name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: campus_inbox_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/campus_inbox_test
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Unit and integration tests (SQLite + PostgreSQL)
        run: pytest -q
      - name: Migrations match the models
        run: |
          DATABASE_URL=sqlite:///./ci_check.db alembic upgrade head
          DATABASE_URL=sqlite:///./ci_check.db alembic check
      - name: Eval (live, only if the GEMINI_API_KEY secret is set)
        if: env.GEMINI_API_KEY != ''
        run: python -m eval.run_eval --data eval/data/synthetic.jsonl
      - name: Upload eval report
        if: env.GEMINI_API_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: backend/eval/out/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
